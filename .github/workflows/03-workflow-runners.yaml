name : 03- Workflow Runners
on : push

jobs:
  ubuntu-echo:
    runs-on : ubuntu-latest
    steps:
      - name: Show the Runner
        run : |
         echo "This job is running on an Ubuntu runner."
         echo "Runner OS : ${{ runner.os }}"
windows-echo:
  runs-on : windows-latest
  steps:
    - name: Show OS
      shell: bash
      run : |
         echo "This job is running on an Ubuntu runner."
         echo "Runner OS : $Runner_OS"
      
